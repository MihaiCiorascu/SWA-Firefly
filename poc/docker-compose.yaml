services:

  nats:
    image: nats:2-alpine
    container_name: wildfiresync-nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  postgres:
    image: postgres:18
    container_name: wildfiresync-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wildfiresync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  nats-data:
  postgres-data:
