spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/wildfiresync
    username: postgres
    password: postgres
  jpa:
    hibernate:
      # Flyway owns the schema. Letting Hibernate derive it from the entities instead would create
      # tables that do not match db/migration, and the events table not at all.
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/postgres
  jackson:
    datatype:
      datetime:
        # the tablet reads createdAt with Instant.parse, so timestamps go out as ISO-8601 text
        write-dates-as-timestamps: false

wildfiresync:
  nats:
    url: nats://localhost:4222

logging:
  level:
    com.wildfiresync.server: DEBUG
