stages:
  - build
  - test
  - integration

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/poc/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

.gradle:
  image: eclipse-temurin:21-jdk
  interruptible: true
  timeout: 30m
  before_script:
    - cd poc
    - chmod +x gradlew
  cache:
    key:
      files:
        - poc/gradle/wrapper/gradle-wrapper.properties
      prefix: gradle
    paths:
      - poc/.gradle/wrapper
      - poc/.gradle/caches
    policy: pull

.gradle-tests:
  extends: .gradle
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - poc/*/build/reports/tests/
    reports:
      junit:
        - poc/core/build/test-results/test/TEST-*.xml
        - poc/server/build/test-results/test/TEST-*.xml
        - poc/experiments/build/test-results/test/TEST-*.xml
        - poc/device/build/test-results/testDebugUnitTest/TEST-*.xml

.code-only:
  rules:
    - changes:
        - poc/**/*
        - .gitlab-ci.yml

build:
  extends: .gradle
  stage: build
  cache:
    key:
      files:
        - poc/gradle/wrapper/gradle-wrapper.properties
      prefix: gradle
    paths:
      - poc/.gradle/wrapper
      - poc/.gradle/caches
    policy: pull-push
  script:
    - ./gradlew :core:assemble :server:assemble :experiments:assemble

core:
  extends: .gradle-tests
  stage: test
  script:
    - ./gradlew :core:test :experiments:test

server:unit:
  extends: .gradle-tests
  stage: test
  script:
    - ./gradlew :server:test --tests '*OperationEventConsumerTest'

device:
  extends:
    - .gradle-tests
    - .code-only
  stage: test
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/poc/.android-sdk"
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/poc/.android-sdk"
    ANDROID_CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
  cache:
    - key:
        files:
          - poc/gradle/wrapper/gradle-wrapper.properties
        prefix: gradle
      paths:
        - poc/.gradle/wrapper
        - poc/.gradle/caches
      policy: pull-push
    - key: android-sdk
      paths:
        - poc/.android-sdk
  before_script:
    - !reference [.gradle, before_script]
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        echo "Installing the Android command line tools"
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        if ! curl -fsSL -o /tmp/cmdline-tools.zip "$ANDROID_CMDLINE_TOOLS_URL"; then
          echo
          echo "Could not download $ANDROID_CMDLINE_TOOLS_URL"
          echo "Google replaces that build number on every release. Take the current linux link from"
          echo "https://developer.android.com/studio#command-line-tools-only and set the"
          echo "ANDROID_CMDLINE_TOOLS_URL variable in Settings > CI/CD > Variables, or edit it here."
          exit 1
        fi
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
        mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
    - |
      for i in $(seq 20); do echo y; done | sdkmanager --licenses > /dev/null
  script:
    - ./gradlew :device:testDebugUnitTest

server:context:
  extends:
    - .gradle-tests
    - .code-only
  stage: integration
  services:
    - name: postgres:18
      alias: postgres
    - name: nats:2-alpine
      alias: nats
      command: ["-js"]
  variables:
    POSTGRES_DB: wildfiresync
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/wildfiresync"
    WILDFIRESYNC_NATS_URL: "nats://nats:4222"
  script:
    - |
      for service in postgres:5432 nats:4222; do
        host=${service%%:*}; port=${service##*:}
        if ! timeout 60 bash -c "until cat < /dev/null > /dev/tcp/$host/$port; do sleep 1; done" 2>/dev/null; then
          echo "$host did not come up within 60s, so this job cannot tell you anything useful"
          exit 1
        fi
      done
      sleep 2
    - ./gradlew :server:test --tests '*ServerApplicationTests'

server:merge:
  extends:
    - .gradle-tests
    - .code-only
  stage: integration
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  allow_failure: true
  script:
    - |
      if ! timeout 20 bash -c 'until cat < /dev/null > /dev/tcp/docker/2375; do sleep 1; done' 2>/dev/null; then
        echo
        echo "This runner cannot start containers, so MergeServiceTests cannot run here."
        echo "Either register a runner with the docker-in-docker privileged setting, or drop this job"
        echo "from .gitlab-ci.yml and run ./gradlew :server:test locally before opening a merge request."
        echo "server:context still covers whether the application starts and wires up."
        exit 1
      fi
      echo "Docker is reachable, starting the merge tests"
    - ./gradlew :server:test --tests '*MergeServiceTests'
